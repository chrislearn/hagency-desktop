[package]
name = "hagency-owner-controller"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "Standalone Hagency hosting controller: the shared owner dashboard in a small macOS app (ADR 0012)"
publish = false

# Independent of the Rinx package: no Matrix SDK, chat timeline or Hagency
# engine is linked. It talks to the owner daemon over its local socket.
[workspace]

[[bin]]
name = "hagency-owner-controller"
path = "src/main.rs"

[dependencies]
# Same effective Makepad source and revision as Desktop's [patch] mappings.
makepad-widgets = { git = "https://www.github.com/OctoSense-org/makepad.git", rev = "ebec2e5c866eae3c791e2f24d59db543cad97a05" }
hagency-owner-dashboard = { path = "../../crates/owner-dashboard" }
serde_json = "1"
libc = "0.2"
url = "2"

[features]
# Deterministic review fixtures for the headless harness (never in release).
fixtures = ["hagency-owner-dashboard/fixtures"]
native-accessibility = ["hagency-owner-dashboard/native-accessibility"]

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 16
strip = "debuginfo"
