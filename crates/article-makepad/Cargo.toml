[package]
name = "article-makepad"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "Reusable native Makepad article editing and viewing widgets"

[workspace]

[dependencies]
makepad-markdown-widgets = { git = "https://www.github.com/OctoSense-org/makepad.git", rev = "a0ad1839c61cecbd7e83251cfb7d50d7a725ee48", features = ["full", "editormd"] }
article-core = { path = "../article-core" }
makepad-widgets = { git = "https://github.com/kevinaboos/makepad", branch = "button-grab-key-focus" }
unicode-segmentation = "1.11.0"
libc = "0.2"

# Keep all Makepad widgets on the same compatibility revision as the renderer.
[patch."https://github.com/kevinaboos/makepad"]
makepad-widgets = { git = "https://www.github.com/OctoSense-org/makepad.git", rev = "a0ad1839c61cecbd7e83251cfb7d50d7a725ee48" }
